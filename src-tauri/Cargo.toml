[package]
name = "omnimind-ai-studio"
version = "1.0.0"
description = "OmniMind AI Studio - Ultimate Desktop AI Command Center"
authors = ["OmniMind"]
edition = "2021"

[lib]
name = "omnimind_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
